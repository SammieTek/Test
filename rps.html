<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>🪨Rock, 📃Paper, ✂️Scissors </title>
  <style>
    body {
      background-color: #111;
      color: #fff;
      font-family: 'Courier New', monospace;
      text-align: center;
      padding-top: 50px;
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 10px;
    }

    p {
      font-size: 1.1rem;
      margin: 10px auto;
    }

    button {
      background-color: #fff;
      color: #111;
      border: none;
      padding: 12px 24px;
      margin: 10px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 5px;
      cursor: pointer;
      transition: 0.2s ease;
    }

    button:hover {
      background-color: #444;
      color: #fff;
    }

    #result {
      margin-top: 20px;
      font-size: 1.3rem;
      font-style: italic;
    }

    #scoreboard {
      margin-top: 30px;
      background-color: #222;
      padding: 20px;
      border-radius: 8px;
      width: 300px;
      margin-left: auto;
      margin-right: auto;
    }

    #scoreboard h2 {
      margin-bottom: 10px;
    }

    button:last-of-type {
      background-color: #ff4d4d;
    }
  </style>
</head>
<body>
  <h1>Rock 🪨 Paper 📃 Scissors ✂️</h1>
  <p>Choose your own chaos and play against the machine :)</p>

  <button onclick="playRPS('rock')">🪨 Rock</button>
  <button onclick="playRPS('paper')">📃 Paper</button>
  <button onclick="playRPS('scissors')">✂️ Scissors</button>

  <p id="result"></p>

  <div id="scoreboard">
    <h2>Scoreboard</h2>
    <p>Wins: <span id="wins">0</span></p>
    <p>Losses: <span id="losses">0</span></p>
    <p>Ties: <span id="ties">0</span></p>
  </div>

  <button onclick="resetScoreboard()">🧹 Reset Scoreboard</button>

  <script>
    let wins = 0;
    let losses = 0;
    let ties = 0;

    function playRPS(userChoice) {
      const choices = ["rock", "paper", "scissors"];
      const userNum = choices.indexOf(userChoice);
      const compNum = Math.floor(Math.random() * 3);
      const compChoice = choices[compNum];

      let msg = "";

      if (userNum === compNum) {
        msg = `You both picked ${userChoice}. OOP. It's a tie. Try again, mortal.`;
        ties++;
      } else if (
        (userNum === 0 && compNum === 2) ||
        (userNum === 1 && compNum === 0) ||
        (userNum === 2 && compNum === 1)
      ) {
        msg = `You picked ${userChoice}, they picked ${compChoice}. You win, legend.`;
        wins++;
      } else {
        msg = `You picked ${userChoice}, they picked ${compChoice}. Congrats, you lost. Try again!`;
        losses++;
      }

      document.getElementById("result").textContent = msg;
      updateScoreboard();

      if (wins >= 20) {
        alert("Hey, you dropped your crown 👑! You reached 20 wins! The scoreboard will now reset.");
        resetScoreboard();
      }

      setTimeout(() => {
        if (confirm("Wanna go again or are you scared?")) {
          document.getElementById("result").textContent = "";
        } else {
          alert("Fine. Rage quit, coward 😌");
        }
      }, 300);
    }

    function updateScoreboard() {
      document.getElementById("wins").textContent = wins;
      document.getElementById("losses").textContent = losses;
      document.getElementById("ties").textContent = ties;
    }

    function resetScoreboard() {
      wins = 0;
      losses = 0;
      ties = 0;
      updateScoreboard();
      document.getElementById("result").textContent = "Scoreboard reset. We never speak of it again.";
    }

  // References:
  // Style Reference:
  // Based on examples and guidelines from W3Schools CSS Tutorial
  // https://www.w3schools.com/css/
  // setTimeout(): https://www.w3schools.com/jsref/met_win_settimeout.asp
  // confirm(): https://www.w3schools.com/jsref/met_win_confirm.asp
  // Used to delay the play again prompt and allow user interaction
  // added Emojis for "flavor" by using the Win + '.' key 
  // Scoreboard logic uses textContent to update values in real time
  // https://www.w3schools.com/jsref/prop_node_textcontent.asp
  // https://www.w3schools.com/js/js_functions.asp
  // Helps update scoreboard elements dynamically and reset with functions

  </script>
</body>
</html>
